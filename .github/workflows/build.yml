name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python3 -m json.tool hosted/crossdrop/guide-1.json
          python3 -m json.tool crosspoint-plugin/crossdrop/device.json
          python3 -m json.tool crosspoint-plugin/crossdrop/manifest.json

      - name: Lua syntax check + harness
        run: |
          sudo apt-get update && sudo apt-get install -y luajit
          for f in koreader-plugin/crossdrop.koplugin/*.lua; do
            luajit -bl "$f" >/dev/null
          done
          luajit koreader-plugin/test/harness_crossdrop.lua

      - name: Build release zips
        run: ./scripts/build-zips.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Releases
          path: releases/*.zip
          if-no-files-found: error